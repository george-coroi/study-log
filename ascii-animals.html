<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII animals</title>
<style>
  :root { --bg: #060914; --ink: #E8ECF4; --ink-2: #8B93A5; --line: rgba(255, 255, 255, 0.10); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--ink);
    font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 40%, rgba(40, 70, 160, 0.18), transparent 70%),
      linear-gradient(rgba(110, 150, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 150, 255, 0.045) 1px, transparent 1px);
    background-size: 100% 100%, 12px 12px, 12px 12px;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  nav {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2;
    display: flex; gap: 2px; padding: 4px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none;
    background: rgba(16, 20, 34, 0.72); border: 0.5px solid var(--line); border-radius: 999px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 13px;
    border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px; cursor: pointer;
    transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1), color 150ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.10); color: var(--ink); font-weight: 600; }
  nav button:focus-visible { outline: 2px solid #64B5FF; outline-offset: 1px; }
  nav i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .back, .hint { position: fixed; z-index: 2; font-size: 12px; color: var(--ink-2); }
  .back { top: 27px; left: 20px; text-decoration: none; }
  .back:hover { color: var(--ink); }
  .hint { left: 20px; bottom: 18px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  @media (max-width: 900px) { .back { display: none; } nav { top: 12px; } }
  /* Background mode: shown behind Study Log, so no controls and no backdrop of its own */
  .bg body { background: transparent; }
  .bg nav, .bg .back, .bg .hint { display: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="Colourful animals made of keyboard characters drifting across the screen" role="img"></canvas>
<a class="back" href="index.html">&larr; Study Log</a>
<nav id="tabs" aria-label="Animal"></nav>
<div class="hint">move to nudge &middot; click to scatter</div>

<script>
var BG = location.search.indexOf("bg") >= 0;
if (BG) document.documentElement.classList.add("bg");
</script>
<script src="sprites.js"></script>
<script>


var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var W = 0, H = 0, dpr = 1, kind = "all", swarm = [];
var mouse = { x: -999, y: -999 };
var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function rnd(a, b) { return a + Math.random() * (b - a); }
function hash(a, b, c) {
  var h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 7, 668265263) ^ Math.imul(c + 13, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

// Movement tuning per species. speed: cruising pace; k: how quickly velocity eases toward its target
// (low = floaty and graceful, high = snappy); wander: how much the heading meanders; flock: loose grouping.
var SPEC = {
  butterfly: { speed: 1.25, k: 0.045, wander: 1.0, flock: 0.6 },
  jellyfish: { speed: 0.0,  k: 0.035, wander: 0.4, flock: 0 },
  dragonfly: { speed: 0.0,  k: 0.14,  wander: 0.5, flock: 0 },
  koi:       { speed: 1.05, k: 0.03,  wander: 0.7, flock: 1.0 },
  frog:      { speed: 0,    k: 0.2,   wander: 0,   flock: 0 },
  crane:     { speed: 1.1,  k: 0.025, wander: 0.3, flock: 1.0 },
  crab:      { speed: 0,    k: 0.12,  wander: 0,   flock: 0 }
};
var BASE = {};   // a shared drift direction per species, so each kind travels as a loose group

function spawn(k) {
  var sp = SPRITES[k], s = SIZES[Math.floor(Math.random() * SIZES.length)];
  if (BASE[k] === undefined) BASE[k] = k === "jellyfish" ? -Math.PI / 2 : k === "dragonfly" ? rnd(0, Math.PI * 2)
    : k === "butterfly" ? [-0.6, -2.5, 0.5, 2.6][Math.floor(Math.random() * 4)] + rnd(-0.2, 0.2) : (Math.random() < 0.5 ? 0 : Math.PI) + rnd(-0.25, 0.25);
  var o = { k: k, s: s, depth: (s - SIZES[0]) / (SIZES[SIZES.length - 1] - SIZES[0]), seed: Math.floor(Math.random() * 1e6),
            x: rnd(0, W), y: rnd(90, H - 60), vx: 0, vy: 0, kx: 0, ky: 0, dir: 1, ang: 0,
            heading: BASE[k] + rnd(-0.5, 0.5), ph: Math.random(), frame: 0, next: rnd(0, 1500), mode: 0, t0: 0 };
  if (k === "frog" || k === "crab") { o.gy = rnd(H * 0.72, H * 0.94) - sp.h * s / 2; o.y = o.gy; o.dir = Math.random() < 0.5 ? -1 : 1; }
  if (k === "crane") o.y = rnd(110, H * 0.5);
  return o;
}
function reset() {
  swarm = []; BASE = {};
  var scale = BG ? 0.6 : 1;   // a calmer swarm behind the app
  if (kind === "all") ORDER.forEach(function (k) { for (var i = 0; i < Math.ceil(COUNT[k] / 2.5 * scale); i++) swarm.push(spawn(k)); });
  else for (var i = 0; i < Math.ceil(COUNT[kind] * scale); i++) swarm.push(spawn(kind));
  swarm.sort(function (a, b) { return a.s - b.s; });   // far (small) ones behind near (big) ones
}

function wrapAng(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
function towardAng(a, b, f) { return a + wrapAng(b - a) * Math.min(1, f); }
// Facing for side-view sprites (crane): mirror when travelling left, tilt with the climb or dive.
function sideFacing(o) {
  if (Math.abs(o.vx) > 0.05) o.dir = o.vx >= 0 ? 1 : -1;
  return o.dir > 0 ? Math.atan2(o.vy, o.vx) : Math.atan2(-o.vy, -o.vx);
}

// Advance an animal's own animation phase (0..1) and pick the matching frame.
function adv(o, ms, dt) { o.ph = (o.ph + dt * 16.67 / ms) % 1; var q = SPRITES[o.k].seq; return q[Math.floor(o.ph * q.length) % q.length]; }
// When an animal drifts off-screen it comes back on the upstream edge, so the stream keeps flowing across.
function reenter(o, m) {
  var b = BASE[o.k], cx = Math.cos(b), cy = Math.sin(b);
  if (Math.abs(cx) >= Math.abs(cy)) { o.x = cx > 0 ? -m : W + m; o.y = rnd(60, H - 60); }
  else { o.y = cy > 0 ? -m : H + m; o.x = rnd(0, W); }
  o.heading = b + rnd(-0.3, 0.3); o.kx = o.ky = 0;
}

// o.x / o.y are the sprite's centre. Each species sets a target velocity; the real velocity eases toward it.
function step(o, t, dt) {
  var sp = SPRITES[o.k], c = SPEC[o.k], h = sp.h * o.s, w = sp.w * o.s, n = o.seed;
  var onGround = o.k === "frog" || o.k === "crab";
  var pace = 0.6 + 0.6 * o.depth;              // near animals move faster: a sense of depth
  var tx = 0, ty = 0, k = c.k, face = o.ang, p;

  if (!onGround) {
    // Smooth meander: two slow sine waves steer the heading, so paths curve instead of jittering.
    // Follow the species' stream, weaving gentle S-curves around it.
    var lane = BASE[o.k] + (Math.sin(t / 2600 + n) * 0.35 + Math.sin(t / 6100 + n * 1.3) * 0.25) * c.wander;
    o.heading = towardAng(o.heading, lane, 0.015 * dt);
    // Loose flocking with the same species: match heading, drift together, keep a little space.
    if (c.flock) {
      var ax = 0, ay = 0, cx = 0, cy = 0, cnt = 0;
      for (var i = 0; i < swarm.length; i++) {
        var q = swarm[i]; if (q === o || q.k !== o.k) continue;
        var ddx = q.x - o.x, ddy = q.y - o.y, dd = Math.hypot(ddx, ddy);
        if (dd > 220 || dd === 0) continue;
        ax += Math.cos(q.heading); ay += Math.sin(q.heading); cx += q.x; cy += q.y; cnt++;
        var room = (Math.max(w, h) + Math.max(SPRITES[q.k].w, SPRITES[q.k].h) * q.s) * 0.8;
        if (dd < room) { tx -= ddx / dd * (1 - dd / room) * 2.6; ty -= ddy / dd * (1 - dd / room) * 2.6; }
      }
      if (cnt) {
        o.heading = towardAng(o.heading, Math.atan2(ay, ax), 0.012 * c.flock * dt);
      }
    }
  }

  switch (o.k) {
    case "butterfly":
      // Each wingbeat gives a little surge and lift: the fluttering, bobbing flight of a butterfly.
      o.frame = adv(o, 460 + n % 160, dt);
      var beat = Math.max(0, Math.sin(o.ph * Math.PI * 2));
      var spd = c.speed * pace * (0.7 + 0.6 * beat);
      tx += Math.cos(o.heading) * spd; ty += Math.sin(o.heading) * spd - beat * 0.35 * pace + 0.12;
      face = Math.atan2(o.vx, -o.vy) * 0.75;         // body leans into the direction of travel
      break;
    case "jellyfish":
      // Pulse: a strong push while the bell contracts, then a slow coast and gentle sink.
      o.frame = adv(o, 2600 + n % 700, dt); p = o.ph;
      o.heading = towardAng(o.heading, -Math.PI / 2 + Math.sin(t / 3200 + n) * 0.7, 0.02 * dt);
      var thrust = Math.max(0, Math.sin((p - 0.25) * Math.PI * 2)) * 2.0 * pace;   // push while the bell squeezes
      tx += Math.cos(o.heading) * thrust; ty += Math.sin(o.heading) * thrust + 0.22;
      k = thrust > 0 ? 0.07 : 0.02;
      face = Math.atan2(o.vx, -o.vy) * 0.6;
      break;
    case "dragonfly":
      // Hover in place, then dart in a new direction and stop dead.
      if (t > o.next) {
        o.mode = o.mode ? 0 : 1;
        o.next = t + (o.mode ? rnd(260, 420) : rnd(600, 1600));
        if (o.mode) o.heading = BASE[o.k] + rnd(-1.1, 1.1);
      }
      if (o.mode) { tx += Math.cos(o.heading) * 6 * pace; ty += Math.sin(o.heading) * 6 * pace; k = 0.2; }
      else { tx += Math.sin(t / 130 + n) * 0.25; ty += Math.cos(t / 170 + n) * 0.25; k = 0.12; }
      o.frame = adv(o, 130, dt);
      face = o.mode ? Math.atan2(o.vy, o.vx) : towardAng(o.ang, o.heading, 0.05 * dt);
      break;
    case "koi":
      var ks = c.speed * pace * (0.85 + 0.25 * Math.sin(t / 900 + n));
      tx += Math.cos(o.heading) * ks; ty += Math.sin(o.heading) * ks;
      o.frame = adv(o, 1100 / Math.max(0.5, ks), dt);   // tail beats faster when swimming faster
      face = Math.atan2(o.vy, o.vx);
      break;
    case "crane":
      // Stay near level flight; the wing cycle gives lift on the downstroke.
      o.heading = towardAng(o.heading, (Math.cos(o.heading) >= 0 ? 0 : Math.PI) + Math.sin(t / 2600 + n) * 0.22, 0.01 * dt);
      o.frame = adv(o, 1150 + n % 300, dt);
      var lift = Math.max(0, -Math.cos(o.ph * Math.PI * 2)) * 0.55;   // lift on the downstroke
      tx += Math.cos(o.heading) * c.speed * pace; ty += Math.sin(o.heading) * c.speed * pace - lift;
      break;
    case "frog":
      if (t > o.next) {
        o.mode = o.mode ? 0 : 1; o.next = t + (o.mode ? 620 : rnd(700, 2400)); o.t0 = t;
        if (o.mode && (o.x < 40 || o.x > W - 40 || Math.random() < 0.25)) o.dir = -o.dir;
      }
      if (o.mode) {
        p = Math.min(1, (t - o.t0) / 620);
        tx = 2.6 * pace * o.dir; k = 0.3;
        o.y = o.gy - Math.sin(Math.PI * p) * o.s * 8;          // arc
        o.frame = p < 0.85 ? 1 : 0;
        face = (0.5 - p) * 0.6 * o.dir;
      } else { o.y = o.gy; o.frame = 0; face = 0; k = 0.3; }
      break;
    case "crab":
      if (t > o.next) { o.mode = o.mode ? 0 : 1; o.next = t + (o.mode ? rnd(600, 1100) : rnd(400, 1600)); if (o.mode) o.dir = Math.random() < 0.5 ? -1 : 1; }
      if (o.mode) { tx = 1.6 * pace * o.dir; o.frame = cyc(o, t / 110); } else o.frame = 0;
      face = Math.sin(t / 180 + n) * (o.mode ? 0.05 : 0);
      break;
  }

  // Pointer: animals steer away when it comes close, and settle back afterwards.
  var dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy), R = 170;
  if (d < R && d > 0) {
    var f = (1 - d / R);
    tx += dx / d * f * 7; ty += dy / d * f * (onGround ? 0 : 7); k = Math.max(k, 0.12);
    if (!onGround) o.heading = towardAng(o.heading, Math.atan2(dy, dx), 0.08 * f * dt);
  }

  var e = 1 - Math.pow(1 - Math.min(1, k), dt);    // frame-rate independent easing
  o.vx += (tx - o.vx) * e; o.vy += (ty - o.vy) * e;
  o.x += (o.vx + o.kx) * dt;
  if (onGround) o.gy = Math.min(H - h / 2 - 8, Math.max(H * 0.5, o.gy + o.ky * dt * 0.3));
  else o.y += (o.vy + o.ky) * dt;
  o.kx *= Math.pow(0.9, dt); o.ky *= Math.pow(0.9, dt);

  if (o.k === "crane") face = sideFacing(o) * 0.8;
  else if (o.k !== "frog" && o.k !== "crab") o.dir = 1;
  o.ang = towardAng(o.ang, face, 0.12 * dt);         // turn smoothly, never snap

  var m = Math.max(w, h);
  if (onGround) { if (o.x > W + m) { o.dir = -1; o.x = W + m; } if (o.x < -m) { o.dir = 1; o.x = -m; } }
  else if (o.x > W + m || o.x < -m || o.y > H + m || o.y < -m) reenter(o, m);
}

// A click sends everything nearby flying outward, then they drift back into their paths.
function burst(x, y) {
  swarm.forEach(function (o) {
    var dx = o.x - x, dy = o.y - y, d = Math.hypot(dx, dy) || 1, R = 300;
    if (d > R) return;
    var f = (1 - d / R) * 13;
    o.kx += dx / d * f; o.ky += dy / d * f;
    o.heading = Math.atan2(dy, dx);
    if (o.k === "frog") { o.mode = 1; o.t0 = performance.now(); o.next = o.t0 + 620; o.dir = dx >= 0 ? 1 : -1; }
  });
}

function draw(o, t) {
  var sp = SPRITES[o.k], pal = sp.pal, cells = sp.cells[o.frame], s = o.s, tick = Math.floor(t / 240);
  var w = sp.w * s, h = sp.h * s;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var ga = 0.6 + 0.4 * o.depth; ctx.globalAlpha = ga;
  ctx.translate(o.x, o.y); ctx.rotate(o.ang);
  if (o.dir < 0) ctx.scale(-1, 1);

  // Soft glow behind the animal.
  var r = Math.max(w, h) * 0.75, g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, rgba(pal[2], 0.22)); g.addColorStop(1, rgba(pal[2], 0));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2);

  var ox = -w / 2, oy = -h / 2, gap = s > 8 ? 1.5 : 1;
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i], n = hash(o.seed, i, 7), twinkle = hash(o.seed, i, tick);
    var lvl = c.type === 3 ? 5 : c.type === 2 ? 0 : c.type === 1 ? 4 : c.type === 4 ? 3 : Math.max(1, Math.min(4, Math.round(1.2 + c.edge * 2.2 + (n - 0.5) * 1.4 + (twinkle > 0.95 ? 1 : 0))));
    var px = ox + c.x * s, py = oy + c.y * s;
    ctx.globalAlpha = c.type === 4 ? ga * 0.92 : ga;   // fins and tails are slightly see-through
    ctx.fillStyle = pal[lvl];
    ctx.fillRect(px + gap / 2, py + gap / 2, s - gap, s - gap);
    // Top edge highlight gives each tile a little depth.
    ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fillRect(px + gap / 2, py + gap / 2, s - gap, Math.max(1, s * 0.15));
    if (s >= 8) {
      ctx.fillStyle = lvl === 5 ? "rgba(0,0,0,0.45)" : lvl >= 3 ? rgba(pal[0], 0.7) : rgba(pal[4], 0.65);
      ctx.fillText(CHARS.charAt(Math.floor(twinkle * CHARS.length)), px + s / 2, py + s / 2 + 0.5);
    }
  }
}

var last = 0;
function frame(t) {
  var dt = Math.min(3, (t - last) / 16.67 || 1); last = t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  swarm.forEach(function (o) {
    ctx.font = "700 " + Math.round(o.s * 0.8) + "px ui-monospace, 'Cascadia Mono', Consolas, monospace";
    if (!still) step(o, t, dt);
    draw(o, t);
  });
  if (!still) requestAnimationFrame(frame);
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  if (still) requestAnimationFrame(frame);
}

var KINDS = ["all"].concat(ORDER);
function pick(k) {
  kind = k; history.replaceState(null, "", "#" + k);
  [].forEach.call(document.querySelectorAll("#tabs button"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.k === k)); });
  reset();
  if (still) requestAnimationFrame(frame);
}

var tabs = document.getElementById("tabs");
KINDS.forEach(function (k, i) {
  var b = document.createElement("button");
  b.type = "button"; b.dataset.k = k; b.setAttribute("aria-pressed", "false"); b.title = "Key " + i;
  var dot = document.createElement("i");
  dot.style.setProperty("--c", k === "all" ? "#ffffff" : SPRITES[k].pal[3]);
  b.appendChild(dot); b.appendChild(document.createTextNode(k === "all" ? "All" : SPRITES[k].name));
  b.addEventListener("click", function () { pick(k); });
  tabs.appendChild(b);
});
addEventListener("keydown", function (e) { var n = parseInt(e.key, 10); if (n >= 0 && n < KINDS.length) pick(KINDS[n]); });
addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointerdown", function (e) { if (!e.target.closest("nav, a")) burst(e.clientX, e.clientY); });
addEventListener("pointerleave", function () { mouse.x = mouse.y = -999; });
addEventListener("resize", resize);
addEventListener("hashchange", function () { var k = location.hash.slice(1); if (KINDS.indexOf(k) >= 0 && k !== kind) pick(k); });

resize();
var startKind = location.hash.slice(1);
pick(KINDS.indexOf(startKind) >= 0 ? startKind : "all");
if (!still) requestAnimationFrame(frame);
</script>
</body>
</html>
